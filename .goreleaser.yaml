# GoReleaser configuration for inkpress. Run through `make release`, which checks
# the prerequisites first; `make release-snapshot` builds locally without
# publishing.
version: 2

project_name: inkpress

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: inkpress
    main: ./cmd/inkpress
    binary: inkpress
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# One macOS binary for Intel and Apple silicon; it is what gets signed,
# notarised and shipped in the Homebrew cask.
#
# Signing and notarisation use Apple's codesign and notarytool with keychain
# credentials (scripts/notarize.sh), so a release must run on a Mac. Snapshots
# skip them.
universal_binaries:
  - id: inkpress
    replace: true
    hooks:
      post:
        - cmd: ./scripts/notarize.sh "{{ .Path }}" "{{ .IsSnapshot }}"
          output: true

archives:
  - id: inkpress
    ids: [inkpress]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: inkcheck
    name: inkpress
  draft: false
  prerelease: auto

homebrew_casks:
  - name: inkpress
    ids: [inkpress]
    binaries: [inkpress]
    description: Markdown slides to PDF, printed by an installed Chromium-based browser.
    homepage: https://github.com/inkcheck/inkpress
    license: Apache-2.0
    directory: Casks
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "inkpress {{ .Tag }}"
    repository:
      owner: inkcheck
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
