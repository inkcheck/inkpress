baseURL: "https://inkcheck.github.io/inkpress/"
title: inkpress
locale: en-gb

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false

enableInlineShortcodes: true
enableGitInfo: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Layouts
      pageRef: /docs/layouts
      weight: 2
    - name: Search
      weight: 8
      params:
        type: search
    - name: GitHub
      weight: 9
      url: "https://github.com/inkcheck/inkpress"
      params:
        icon: github
  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 1

params:
  description: Markdown slides, printed to PDF, styled by template packs.
  page:
    width: normal
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
  editURL:
    enable: false
  highlight:
    copy:
      enable: true
      display: hover
